name: Bug report
description: Something quacked when it should not have.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: quackd version
      description: Output of `quackd --version`
    validations:
      required: true
  - type: dropdown
    id: robot
    attributes:
      label: Robot
      description: The `--robot <adapter>:<backend>` you ran. `quackd list-adapters` lists them all.
      options:
        - "microduck:sim2d (the default)"
        - "microduck:mock"
        - "microduck:jsonrpc (real robot, experimental)"
        - "microduck:websocket (stub)"
        - "reachy_mini:sim2d"
        - "reachy_mini:mock"
        - "reachy_mini:sdk (real robot, experimental)"
        - "lerobot:mock"
        - "lerobot:real (real arm, experimental)"
        - "rosbridge:mock"
        - "rosbridge:ws (real bridge, experimental)"
        - "not robot specific (CLI, docs, validation, MCP)"
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - "fake"
        - "anthropic"
        - "openai"
        - "gemini"
        - "grok"
        - "ollama (local)"
        - "vllm (local)"
        - "llamacpp (local)"
        - "lmstudio (local)"
        - "local (any OpenAI compatible server)"
        - "MCP client (Claude Code / Desktop)"
  - type: textarea
    id: command
    attributes:
      label: Exact command and `.duck` file
      render: shell
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened vs. what you expected
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `quackd doctor`
      render: shell
  - type: textarea
    id: transcript
    attributes:
      label: Relevant lines from `runs/<timestamp>/transcript.jsonl`
      render: json
