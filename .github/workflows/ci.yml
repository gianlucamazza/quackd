name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync (default deps + dev extra — no provider SDKs, no keys)
        run: uv sync --python ${{ matrix.python }} --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests (no network, no API keys; seeded sweeps must be 10 of 10)
        run: uv run pytest
        env:
          QUACKD_STRICT_SEEDS: "1"
      - name: Validate starter ducks
        run: uv run quackd validate ducks/*.duck
      - name: Affective benchmark matrix
        run: uv run python benchmarks/affective_runtime.py --output "${{ runner.temp }}/quackd-affective-benchmark.json"
      - name: Upload affective benchmark
        uses: actions/upload-artifact@v4
        with:
          name: affective-benchmark-py${{ matrix.python }}
          path: ${{ runner.temp }}/quackd-affective-benchmark.json

  emotional:
    name: emotional · py${{ matrix.python }} · ubuntu
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync with emotional-memory
        run: uv sync --python ${{ matrix.python }} --extra dev --extra emotional
      - name: Quality checks
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
      - name: Tests with emotional-memory enabled
        run: uv run pytest
        env:
          QUACKD_STRICT_SEEDS: "1"
      - name: Validate starter ducks
        run: uv run quackd validate ducks/*.duck
